[package]
name = "tuix_rust"
version = "0.1.0"
edition = "2021"
description = "TUIX — Terminal UI Experience (Rust/ratatui port)"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
sysinfo = "0.32"
lazy_static = "1.4"
portable-pty = "0.8"
vt100 = "0.15"
ratatui-explorer = { version = "0.2.1", features = ["crossterm"] }
